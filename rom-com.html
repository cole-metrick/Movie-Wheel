<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="static/css/style-movies.css">
    <script type="text/javascript" src="static/js/script.js"></script>
    <title>Action Movies</title>
</head>
<body>
    <h1 id="winner"></h1>
    <div id="mainbox" class="mainbox">
        <div id="box" class="box">
            <div class="segment" style="--i: 0; background: #fa29de;"><b id='0'>Thunderbolts</b></div>
            <div class="segment" style="--i: 1; background: #2522e4;"><b id='1'>Django Unchained</b></div>
            <div class="segment" style="--i: 2; background: #05d116;"><b id='2'>Jumanji</b></div>
            <div class="segment" style="--i: 3; background: #eb0ca8;"><b id='3'>Mission Impossible</b></div>
            <div class="segment" style="--i: 4; background: #0f0f0f;"><b id='4'>The Hitman's Bodyguard</b></div>
            <div class="segment" style="--i: 5; background: #f11313;"><b id='5'>Uncharted</b></div>
            <div class="segment" style="--i: 6; background: #fca606;"><b id='6'>Fight Club</b></div>
            <div class="segment" style="--i: 7; background: #fa29de;"><b id='7'>Grand Budapest Hotel</b></div>
            <div class="segment" style="--i: 8; background: #2877ee;"><b id='8'>Inglorious Bastards</b></div>
            <div class="segment" style="--i: 9; background: #064457;"><b id='9'>I Am Legend</b></div>
    </div>
        <button class="spin" onclick="rotateFunction()">SPIN</button>
  </div>
    
</body>
</html>
