<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="static/css/style-movies.css">
    <script type="text/javascript" src="static/js/script.js"></script>
    <title>Comedy Movies</title>
</head>
<body>
    <h1 id="winner"></h1>
    <div id="mainbox" class="mainbox">

            <div class="segment" style="--i: 7; background: #fa29de;"><b id='7'>The Devil Wears Prada</b></div>
            <div class="segment" style="--i: 8; background: #2877ee;"><b id='8'>The Big Lebowski</b></div>
            <div class="segment" style="--i: 9; background: #064457;"><b id='9'>Ace Ventura</b></div>

        <button class="spin" onclick="rotateFunction()">SPIN</button>
  </div>
