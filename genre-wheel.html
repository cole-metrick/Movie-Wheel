<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="static/css/style-genre.css">
    <script type="text/javascript" src="static/js/script.js"></script>
    <title>Movie Wheel</title>
</head>
<body>
    <h1 id="winner"></h1>
    <div id="mainbox" class="mainbox">
        <div id="box" class="box">
            <div class="segment" style="--i: 0; background: #eff30b;"><b id='0'>Comedy</b></div>
            <div class="segment" style="--i: 1; background: #2522e4;"><b id='1'>Mind-Fuck</b></div>
            <div class="segment" style="--i: 2; background: #05d116;"><b id='2'>Sci-Fi</b></div>
            <div class="segment" style="--i: 3; background: #eb0ca8;"><b id='3'>Rom-Com</b></div>
            <div class="segment" style="--i: 4; background: #0f0f0f;"><b id='4'>Horror</b></div>
            <div class="segment" style="--i: 5; background: #f11313;"><b id='5'>Action</b></div>
            <div class="segment" style="--i: 6; background: #fca606;"><b id='6'>Cartoon</b></div>
            <div class="segment" style="--i: 7; background: #b700ff;"><b id='7'>Drama</b></div>
            <div class="segment" style="--i: 8; background: #2877ee;"><b id='8'>Fantasy</b></div>
    </div>
        <button class="spin" onclick="rotateFunction()">SPIN</button>
  </div>
    
</body>
</html>
